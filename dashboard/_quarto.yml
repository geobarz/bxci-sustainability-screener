# Quarto project for the dashboard. Renders index.qmd and methods.qmd into
# ../docs so GitHub Pages can serve the site from the /docs folder.
project:
  type: default
  output-dir: ../docs
  pre-render: pre_render.R    # clear the previous render's files from ../docs
  post-render: post_render.R  # add ../docs/.nojekyll for GitHub Pages

execute:
  echo: false
  warning: false
  message: false
